name: "On PR - Generate Build"

on:
  pull_request:
    branches:
      - '*'
      - '*/*'
      - '**'

  workflow_dispatch:

jobs:
  pre-release:
    name: "On PR - Generate Build"
    runs-on: "ubuntu-latest"

    steps:
      - uses: VatsalJagani/splunk-app-action@v4.10.0
        with:
          is_app_inspect_check: false
          to_make_permission_changes: true
          python_requirements_file: "lib/requirements.txt"
