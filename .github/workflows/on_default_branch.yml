name: "Run on Default Branch - Add Utilities & App Inspect"

on:
  push:
    branches:
      - 'develop'

  workflow_dispatch:


jobs:
  pre-release:
    name: "Run on Default Branch - Add Utilities & App Inspect"
    runs-on: "ubuntu-latest"

    steps:
      - uses: VatsalJagani/splunk-app-action@v4.10.0
        with:
          to_make_permission_changes: true
          splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
          splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
          app_utilities: "whats_in_the_app, logger"
          logger_log_files_prefix: "greenalert"
          logger_sourcetype: "greenalert:logs"
          python_requirements_file: "lib/requirements.txt"
